name: mkr
description: "MKR — Market Radar: a market intelligence utility."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.2
  intl: any
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  supabase_flutter: ^2.8.0
  win32_registry: ^3.0.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/icon_foreground.png

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# Native (pre-Flutter-engine) launch splash - same mark as the app icon
# (assets/icon/icon_foreground.png), on the dark theme's exact Material 3
# surface color (#111318, generated from AppTheme's seed color - see
# lib/core/theme/app_theme.dart) so there is no color flash handing off from
# the native splash to the first Flutter frame.
flutter_native_splash:
  color: "#111318"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#111318"
    image: assets/icon/icon_foreground.png
  android: true
  ios: false
  web: false
