<!--
  Supabase Dashboard -> Authentication -> Email Templates -> Change Email Address
  Subject: Confirm your new Market Radar (MKR) email

  {{ .ConfirmationURL }} / {{ .NewEmail }} are Supabase's own template
  variables for this template - never hard-code a URL or address here.
-->
<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1a1a1a;">
  <p style="font-size:13px;font-weight:700;letter-spacing:0.08em;color:#1857A4;text-transform:uppercase;margin:0 0 24px;">Market Radar (MKR)</p>
  <h1 style="font-size:20px;margin:0 0 16px;">Confirm your new email address</h1>
  <p style="font-size:15px;line-height:1.6;margin:0 0 24px;">We received a request to change the email address on your Market Radar account to <strong>{{ .NewEmail }}</strong>.</p>
  <p style="margin:0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1857A4;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 28px;border-radius:8px;">Confirm new email</a>
  </p>
  <p style="font-size:13px;line-height:1.6;color:#666666;margin:0;">If you didn't request this change, please secure your Market Radar account immediately.</p>
  <p style="font-size:13px;color:#666666;margin:24px 0 0;">— Market Radar Team</p>
</div>
